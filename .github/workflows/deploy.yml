name: Deploy

# main が進んだら Cloudflare Workers に配信する。手動実行も残しておく。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に走らせると後勝ちで古い版が出かねないので直列化する。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # opennextjs-cloudflare の CLI は node のシェバンで動くため、両方入れる。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      # prebuild でギャラリーのマニフェストを生成してから opennext がビルドする。
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
